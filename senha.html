<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha</title>

    <link rel="stylesheet" href="senha.css">
</head>
<body>

    <header class="cabecalho">
        <div class="logo">
            <span class="logo-vs">VS</span>
            <span class="logo-texto">VELOCITY<br>SPORTS</span>
        </div>

        <h2>REDEFINIR SENHA</h2>

        <a href="#">precisa de ajuda ?</a>
    </header>

    <main class="container">

        <section class="apresentacao">
            <div class="logo-grande">VS</div>

            <p>
                Sua melhor plataforma de<br>
                compras online
            </p>
        </section>

        <section class="area-formulario">
            <div class="formulario">

                <h1>REDEFINIR</h1>

                <p class="descricao">
                    Informe o e-mail para o qual deseja<br>
                    redefinir sua senha
                </p>

                <form id="formRedefinir">

                    <label for="email">✉ E-MAIL</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                    <button type="submit">
                        REDEFINIR SENHA
                    </button>

                </form>

                <a href="#" class="voltar-login">
                    Voltar ao login
                </a>

            </div>
        </section>

    </main>

    <script src="senha.js"></script>

</body>
</html>
